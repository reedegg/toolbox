<html lang="en">
    <body>
        <h2>Origin of Input:</h2>
        <button type="button" onclick="alertDetails()" style="width: 50em">Alert Details</button><br>
        <button type="button" onclick="logManagement()" style="width: 50em">Log Management</button><br>
        <button type="button" onclick="playbook()" style="width: 50em">Playbook</button><br>
        <button type="button" onclick="artifacts()" style="width: 50em">Artifacts</button><br>
        <button type="button" onclick="challengeQuestions()" style="width: 50em">Challenge Questions</button><br>
        <br>
        <button type="button" onclick="copyOutput()" style="width: 50em">Copy Output</button><br>
        <br>
        <button type="button" onclick="clearTextAreas()" style="width: 50em">Clear</button><br>
        <h2>Input</h2>
        <textarea id="input" style="width: 100%; height: 25em;"></textarea>
        <h2>Output (Markdown)</h2>
        <textarea id="output" readonly style="width: 100%; height: 25em"></textarea>
        <script>

            function logManagement(){
                cleaned = cleanInput()
                keys = ["Key:"]
                values = ["Value"]

                keys.push(...cleaned.slice(1, cleaned.indexOf("Value")))
                values.push(...cleaned.slice(cleaned.indexOf("Value") + 1, cleaned.indexOf("Raw Log")))
                formatchange = cleaned.slice(cleaned.indexOf("Raw Log") + 1)

                for (i = 0; i < formatchange.length; i += 2){
                    keys.push(formatchange[i])
                    values.push(formatchange[i+1])
                }

                keys = keys.map((key) => key.replace(/:/g, "").trim() + ":")
                values = values.map((value) => value = "`" + value + "`")
            
                drawTable([keys,values])
            }
            
            function alertDetails(){
                cleaned = cleanInput()
                keys = ["Key:"]
                values = ["Value"]

                for (i = 0; i < cleaned.length; i += 2){
                    keys.push(cleaned[i].replace(/:/g, "").trim() + ":")
                    values.push("`" + cleaned[i+1] + "`")
                }
                drawTable([keys,values])
            }

            async function copyOutput(){
                try {
                    await navigator.clipboard.writeText(document.getElementById("output").value)
                } catch(error) {
                    console.error(error.message)
                }
            }

            function clearTextAreas(){
                document.getElementById("input").value = "";
                document.getElementById("output").value = "";
            }

            function calculatePadSize(list){
                return(Math.max(...list.map((a) => a.length)))
            }

            function padColumn(list, padValue){
                return(list.map((a) => a + " ".repeat(padValue - a.length)))
            }

            function playbook(){
                cleaned = cleanInput()
                questions = ["Questions"]
                answers = ["Answers"]
                for (i=0;i<cleaned.length;i=i+4){
                    answers.push(cleaned.at(-1-i))
                    questions.push(cleaned.at(-3-i))
                }

                drawTable([questions,answers])

            }

            function cleanInput(){
                return(document.getElementById("input").value.split(/(\t|\n)/).filter((line) => line.trim()).map((line) => line.replace(/`/g, "\\`").replace(/\|/g, "\\|").trim()))
            }

            function drawTable(listOfColumns){
                table = ""
                paddingSizes = []

                for (column in listOfColumns){
                    columnPad = calculatePadSize(listOfColumns[column])
                    listOfColumns[column] = padColumn(listOfColumns[column], columnPad)
                    paddingSizes.push(columnPad)
                }

                for (i=0;i<listOfColumns[0].length;i++){
                    table += "|"

                    if ( i == 1){
                        for (padding of paddingSizes){
                            table += "-".repeat(padding) + "|"
                        }
                        table += "\n|"
                    }
                    for (column of listOfColumns){
                        table += column[i] + "|"
                    }
                    table += "\n"
                }
                document.getElementById("output").value = table
            }

            function artifacts(){
                cleaned = cleanInput()
                values = []
                comments = []
                types = []

                for (i = 0; i < cleaned.length; i += 3){
                    values.push("`" + cleaned[i] + "`")
                    comments.push(cleaned[i+1])
                    types.push(cleaned[i+2])
                }

                drawTable([values,comments,types])

            }

            function challengeQuestions(){
                cleaned = cleanInput()
                questions = ["Questions"]
                answers = ["Answers"]

                for ( i = 0 ; i < cleaned.length; i += 3 ){
                    questions.push(cleaned[i+1])
                    answers.push("`"+cleaned[i+2]+"`")
                }

                drawTable([questions,answers])
            }
        </script>
    </body>
</html>
